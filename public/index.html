<style>
:root{color-scheme:light;--bg:#fff6ee;--bg2:#fdeee6;--ink:#3c3a4f;--soft:#6a6680;--check:rgba(232,96,110,.28);--cloth:#fffaf6}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{min-height:100%;background:linear-gradient(180deg,var(--bg),var(--bg2));background-color:var(--bg)}
body{margin:0;font:16px/1.55 Quicksand,system-ui,sans-serif;color:var(--ink);overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
svg.sp{display:block;shape-rendering:crispEdges}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
header{text-align:center;padding:clamp(28px,5vw,60px) 16px 0;position:relative}
.tip{position:absolute;top:14px;right:max(16px,3vw);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 10px;border-radius:999px;background:#fff;border:2px solid var(--ink);color:var(--ink);font:700 15px Quicksand,sans-serif;text-decoration:none;box-shadow:0 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.tip:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.tip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tip svg{width:30px;height:22px;transform:rotate(-8deg);animation:coin 1.4s steps(1) infinite}
@keyframes coin{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-8deg) translateY(-2px)}}
@media(max-width:480px){header{padding-top:68px}.tip{top:10px;right:10px;padding:0 12px 0 8px;font-size:14px}.tip svg{width:26px;height:19px}}
.burst{width:clamp(104px,16vw,140px);margin:0 auto;transform:rotate(-8deg);filter:drop-shadow(0 5px 0 rgba(150,40,50,.18));transition:transform .4s}
.burst svg{width:100%;height:auto}
.burst:hover{transform:rotate(4deg) scale(1.04)}
h1{font:700 clamp(28px,4vw,42px)/1.12 Quicksand,sans-serif;margin:clamp(14px,2vw,22px) auto 6px;max-width:16em;text-wrap:balance}
header p{color:var(--soft);margin:0 auto;max-width:30em;text-wrap:pretty}
.install{display:none;position:absolute;top:10px;left:10px;min-height:44px;padding:0 12px 0 10px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:700 14px Quicksand,sans-serif;cursor:pointer;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.install svg{width:18px;height:18px;flex:none}
.can-install .install{display:inline-flex}
dialog.how{border:0;border-radius:18px;padding:22px 22px 18px;max-width:min(340px,calc(100vw - 32px));color:var(--ink);background:#fffaf6;box-shadow:0 20px 50px rgba(60,58,79,.25);font:16px/1.5 Quicksand,sans-serif}
dialog.how::backdrop{background:rgba(60,58,79,.35)}
dialog.how b{display:block;font-size:18px;margin-bottom:6px}
dialog.how p{margin:0 0 14px}
dialog.how button{min-height:44px;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 15px Quicksand,sans-serif;cursor:pointer}
.shelf{flex:none;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.4vw,28px);max-width:1180px;margin:clamp(24px,4vw,48px) auto 0;padding:0 max(4vw,16px) 64px}
.tile{all:unset;cursor:pointer;display:grid;gap:10px;text-align:center;align-content:start;color:inherit}
.tile .box{aspect-ratio:1;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(60,58,79,.12),inset 0 -40px 0 rgba(255,255,255,.18);transition:transform .25s}
.tile:hover .box,.tile:focus-visible .box{transform:translateY(-6px)}
.tile:focus-visible{outline:none}
.tile:focus-visible .box{outline:3px solid var(--ink);outline-offset:4px}
.tile .box svg.sp{position:absolute;left:50%;bottom:16%;width:46%;height:46%;transform:translateX(-50%)}
.tile .ground{position:absolute;left:0;right:0;bottom:0;height:20%;background:rgba(255,255,255,.35)}
.tile b{font:600 18px Quicksand,sans-serif}
.tile small{color:var(--soft);font-size:14px;line-height:1.4;display:block;max-width:22em;margin:0 auto}
.tile.soon{cursor:default}.tile.soon .box{filter:grayscale(1) brightness(1.04);box-shadow:none}.tile.soon .box>*{opacity:.4}
.tile.soon:hover .box{transform:none}
.tile.soon b::after{content:" · soon";font-weight:400;opacity:.7}
.flake{position:absolute;width:6px;height:6px;border-radius:1px;opacity:.8;animation:fall 5s linear infinite;animation-play-state:paused}
.tile:hover .flake,.tile:focus-visible .flake{animation-play-state:running}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(260px) rotate(200deg)}}
.tile .anim{animation-play-state:paused}
.tile:hover .anim,.tile:focus-visible .anim{animation-play-state:running}
@media(hover:none){.tile:not(.soon) .anim,.tile:not(.soon) .flake{animation-play-state:running}}
.slide{animation:slide 1.6s steps(4) infinite alternate}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-3px)}}
.bob{animation:bob .9s steps(1) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
.rise{animation:rise 1.2s steps(3) infinite}
.flap{animation:bob 1s steps(1) infinite}
.blink{animation:blink 1.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.35}}
.beat{transform-box:fill-box;transform-origin:50% 50%;animation:beat 1.2s steps(1) infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes rise{from{transform:translateY(1px);opacity:.9}to{transform:translateY(-2px);opacity:0}}
.hop{animation:hop2 .9s steps(2) infinite}
@keyframes hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.fan2{transform-box:view-box;transform-origin:50% 61%;animation:fanx 1.6s steps(2) infinite}
@keyframes fanx{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
footer{margin-top:auto;text-align:center;color:var(--ink);font-size:14px;padding:48px 16px 40px;display:grid;gap:8px;background:linear-gradient(90deg,var(--check) 50%,transparent 0) 0 0/28px 28px,linear-gradient(var(--check) 50%,transparent 0) 0 0/28px 28px,var(--cloth);-webkit-mask:radial-gradient(circle at 14px 0,transparent 13px,#000 14px) 0 0/28px 100% repeat-x;mask:radial-gradient(circle at 14px 0,transparent 13px,#000 14px) 0 0/28px 100% repeat-x}
footer nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
footer nav a,footer nav span{min-height:32px;display:inline-flex;align-items:center}
footer nav span{opacity:.6}
@media(max-width:1000px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.shelf{gap:12px}.tile small{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<dialog class="how" id="how"><b>Add to home screen</b><p id="howText"></p><form method="dialog"><button>Got it</button></form></dialog>
<main class="shelf" id="shelf"></main>
<footer>
  <div>no accounts · no ads · gone when you're done</div>
  <nav id="links"></nav>
  <div>© 2026 150ct</div>
</footer>
<script>
{
const {SITE,SHELF,sprite,burst:SHELF_burst}=window.SHELF;
document.getElementById("burst").innerHTML=SHELF_burst();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const flakes=cols=>Array.from({length:7},(_,i)=>`<span class="flake" style="left:${(i*37)%92+4}%;top:-10px;background:${cols[i%cols.length]};animation-delay:${-(i*0.7)}s;animation-duration:${4+i%3}s"></span>`).join("");
document.getElementById("shelf").innerHTML=SHELF.map(a=>a.status==="live"
  ?`<a class="tile" href="${esc(a.href)}"><div class="box" style="background:${a.bg}">${flakes(a.flakes)}<div class="ground"></div>${sprite(a.sp)}</div><b>${esc(a.name)}</b><small>${esc(a.line)}</small></a>`
  :`<div class="tile soon" aria-disabled="true"><div class="box" style="background:${a.bg}"><div class="ground"></div>${sprite(a.sp)}</div><b>${esc(a.name)}</b><small>${esc(a.line)}</small></div>`
).join("");
const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:`<span>${label} · soon</span>`;
if(SITE.donate){const t=document.getElementById("tip");t.href=SITE.donate;t.hidden=false}
document.getElementById("links").innerHTML=`<a href="/about">About</a>`+link(SITE.donate,"Chip in")+link(SITE.discord,"Discord")+`<a href="/terms">Terms</a><a href="/privacy">Privacy</a>`;
// Add to home screen, phones only.
const ua=navigator.userAgent;
const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const phone=ios||/Android/.test(ua);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(phone&&!standalone)document.body.classList.add("can-install");
document.getElementById("install").onclick=()=>{
  document.getElementById("howText").textContent=ios?"Tap Share, then Add to Home Screen.":"Tap the browser menu, then Add to Home screen.";
  document.getElementById("how").showModal();
};
}
</script>
