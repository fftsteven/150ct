<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Free potluck sign-up sheet. Make a list of dishes, send one link, and guests claim what they're bringing so nothing is doubled. No sign-up or app.">

<meta property="og:site_name" content="150ct">
<meta property="og:title" content="Potluck">
<meta property="og:description" content="Make a list, guests claim what they're bringing. Free, no sign-up.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/app.css">
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<script src="/apps/potluck/lib.js"></script>
<style>
.form{display:grid;gap:22px}
.f{display:grid;gap:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tpls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tp{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 4px 8px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.tp svg{width:44px;height:44px}
.tp[aria-pressed=true],.ic[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--acc)}
.icons{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.ic{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;padding:5px;display:grid;place-items:center}
.ic svg{width:100%;height:100%;display:block}
.emo{display:flex;gap:8px;align-items:center;margin-top:4px}
.emo input{width:5.5em;text-align:center;font-size:22px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 4px 4px 8px;font-weight:600}
.chip svg{width:24px;height:24px;flex:none}
.chip button{width:32px;height:32px;border:0;background:transparent;color:var(--mute);font:700 16px Silkscreen,monospace;border-radius:6px}
.chip button:hover{background:var(--line);color:var(--ink)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
@media(max-width:600px){.two{grid-template-columns:1fr}.tpls{grid-template-columns:repeat(3,minmax(0,1fr))}.icons{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="canonical" href="https://150ct.com/potluck">
<script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "name": "Potluck by 150ct", "url": "https://150ct.com/potluck", "description": "Free potluck sign-up sheet. Make a list of dishes, send one link, and guests claim what they're bringing so nothing is doubled. No sign-up or app.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "featureList": ["Pick a template or type your own list of dishes", "Guests open one link and claim a dish", "Each dish can be claimed by one person, so no duplicates", "Guests can add dishes that aren't on the list", "No accounts; the link deletes itself 30 days after the event"], "publisher": {"@id": "https://150ct.com/#org"}, "isPartOf": {"@id": "https://150ct.com/#site"}}, {"@type": "Organization", "@id": "https://150ct.com/#org", "name": "150ct", "url": "https://150ct.com/", "logo": "https://150ct.com/shared/icon-512.png", "email": "150countapp@gmail.com", "sameAs": ["https://ko-fi.com/150ct"]}, {"@type": "WebSite", "@id": "https://150ct.com/#site", "name": "150ct", "url": "https://150ct.com/", "description": "Free, no sign-up web tools for getting together: potluck sign-ups, finding a day that works, picking where to eat and gift exchange name draws.", "publisher": {"@id": "https://150ct.com/#org"}}]}</script>
</head>
<body>
<nav class="top"><div class="wrap"><a href="/">150ct</a></div></nav>
<header class="band hero">
  <div class="wrap">
    <div>
      <h1 id="pTitle">Your potluck</h1>
      <div class="det" id="pDet"></div>
    </div>
    <div class="sprite" id="pSprite" role="img" aria-label="Invite picture"></div>
  </div>
</header>

<main class="band">
  <div class="wrap">
    <form class="form" id="form" novalidate>
      <h2 id="heading">Make a potluck</h2>

      <div class="f" id="tplField"><label>Start from</label><div class="tpls" id="tpls"></div></div>

      <div class="f"><label for="title">Name</label><input id="title" maxlength="80" placeholder="e.g. Friendsgiving" required></div>
      <div class="two">
        <div class="f"><label for="date">Date</label><input id="date" type="date" required></div>
        <div class="f"><label for="time">Time</label><input id="time" type="time"></div>
      </div>
      <div class="f"><label for="where">Where</label><input id="where" maxlength="160" placeholder="Address or place"></div>
      <div class="f"><label for="note">Note (optional)</label><textarea id="note" maxlength="600" placeholder="Parking, kids, dogs, your number"></textarea></div>

      <div class="f">
        <label>Picture</label>
        <div class="icons" id="icons"></div>
        <div class="emo"><label for="emoji" class="hint" style="font-weight:400">Or an emoji</label><input id="emoji" maxlength="16" placeholder="🙂" autocomplete="off"></div>
      </div>

      <div class="f">
        <label for="dishIn">Dishes</label>
        <p class="hint">Guests pick what they'll bring and can add their own.</p>
        <div class="chips" id="dishes"></div>
        <div class="addrow"><input id="dishIn" maxlength="60" placeholder="Add a dish" autocomplete="off"><button class="btn ghost" type="button" id="dishAdd">Add</button></div>
      </div>

      <div class="linkrow"><button class="btn" id="submit" type="submit">Create</button><span class="status" id="status" aria-live="polite" style="margin:0"></span></div>
    </form>
  </div>
</main>
<footer class="band foot"><div class="wrap"><a class="pack" href="/"><span>150</span><span>ct</span></a><span>Free, no accounts, deletes itself 30 days after the event.</span><span class="legal">© 2026 150ct · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></span></div></footer>

<script>
{
const {ICONS,TEMPLATES,sprite,dishIcon,applyLook,isEmoji,esc,fmtWhen,normalize}=window.G;
const $=id=>document.getElementById(id);
const editSlug=new URLSearchParams(location.search).get("edit")||"";
let hostKey="";
const hm=location.hash.match(/host=([a-z0-9]+)/);
if(hm)hostKey=hm[1];
else if(editSlug){try{hostKey=localStorage.getItem("150ct-host-"+editSlug)||""}catch(e){}}

let tpl="thanksgiving",icon="turkey",dishes=[],titleTouched=false;

$("tpls").innerHTML=Object.entries(TEMPLATES).map(([id,t])=>`<button type="button" class="tp" data-tpl="${id}" aria-pressed="false">${sprite(t.icon)}<span>${esc(t.name)}</span></button>`).join("");
$("icons").innerHTML=Object.entries(ICONS).map(([id,t])=>`<button type="button" class="ic" data-icon="${id}" aria-pressed="false" aria-label="${esc(t.name)}" title="${esc(t.name)}" style="background:${t.hero}">${sprite(id)}</button>`).join("");

function useTemplate(id){
  const t=TEMPLATES[id];tpl=id;icon=t.icon;$("emoji").value="";
  dishes=t.dishes.map(n=>({n}));
  if(!titleTouched)$("title").value=t.title;
  renderDishes();preview();
  if(id==="custom"&&!titleTouched)$("title").focus();
}
function renderDishes(){
  $("dishes").innerHTML=dishes.length?dishes.map((d,i)=>`<span class="chip">${dishIcon(d.n)}<span>${esc(d.n)}</span><button type="button" data-del="${i}" aria-label="Remove ${esc(d.n)}">×</button></span>`).join(""):`<span class="hint">No dishes yet. Guests can still add theirs.</span>`;
}
function preview(){
  applyLook(icon);
  document.querySelectorAll("[data-tpl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tpl===tpl));
  document.querySelectorAll("[data-icon]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.icon===icon));
  $("pSprite").innerHTML=sprite(icon);
  $("pTitle").textContent=$("title").value.trim()||"Your potluck";
  const when=fmtWhen($("date").value,$("time").value),where=$("where").value.trim();
  $("pDet").innerHTML=(when?`<div><b>When</b><span>${esc(when)}</span></div>`:"")+(where?`<div><b>Where</b><span>${esc(where)}</span></div>`:"");
}
function addDish(){
  const n=$("dishIn").value.trim();if(!n)return;
  dishes.push({n});$("dishIn").value="";renderDishes();$("dishIn").focus();
}

$("tpls").addEventListener("click",e=>{const b=e.target.closest("[data-tpl]");if(b)useTemplate(b.dataset.tpl)});
$("icons").addEventListener("click",e=>{const b=e.target.closest("[data-icon]");if(!b)return;icon=b.dataset.icon;$("emoji").value="";preview()});
$("emoji").addEventListener("input",e=>{const v=e.target.value.trim();if(v&&isEmoji(v))icon=v;preview()});
$("dishes").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;dishes.splice(+b.dataset.del,1);renderDishes()});
$("dishAdd").addEventListener("click",addDish);
$("dishIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addDish()}});
$("title").addEventListener("input",()=>{titleTouched=true});
$("form").addEventListener("input",e=>{if(e.target.id!=="dishIn"&&e.target.id!=="emoji")preview()});

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if($("dishIn").value.trim())addDish();
  const payload={title:$("title").value,date:$("date").value,time:$("time").value,where:$("where").value,note:$("note").value,icon,dishes};
  if(!payload.title.trim()){$("status").textContent="Give it a name.";$("title").focus();return}
  if(!payload.date){$("status").textContent="Pick a date.";$("date").focus();return}
  $("submit").disabled=true;$("status").textContent=editSlug?"Saving…":"Creating…";
  try{
    const r=await fetch("/api/links"+(editSlug?"?slug="+encodeURIComponent(editSlug):""),{method:editSlug?"PUT":"POST",headers:{"content-type":"application/json",...(hostKey?{"x-host-key":hostKey}:{})},body:JSON.stringify(editSlug?{data:payload}:{type:"potluck",data:payload})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Couldn't save.");
    if(editSlug){location.href="/potluck/"+editSlug;return}
    try{localStorage.setItem("150ct-host-"+j.slug,j.hostKey)}catch(err){}
    location.href="/potluck/"+j.slug+"#host="+j.hostKey;
  }catch(err){$("status").textContent=err.message||"Couldn't save. Try again.";$("submit").disabled=false}
});

async function init(){
  if(editSlug){
    $("heading").innerHTML=`Edit potluck <a href="/potluck/${encodeURIComponent(editSlug)}" style="font:600 15px 'Work Sans',sans-serif;margin-left:10px">Back</a>`;$("submit").textContent="Save";$("tplField").hidden=true;titleTouched=true;
    try{
      const r=await fetch("/api/links?slug="+encodeURIComponent(editSlug),{headers:hostKey?{"x-host-key":hostKey}:{}});
      const j=await r.json();
      if(!r.ok||!j.isHost)throw 0;
      const ev=normalize(j.link.data);
      ["title","date","time","where","note"].forEach(k=>$(k).value=ev[k]||"");
      icon=ev.icon;if(isEmoji(icon))$("emoji").value=icon;
      dishes=ev.dishes.map(d=>({...d}));tpl="";
      renderDishes();preview();
    }catch(e){$("status").textContent="Only the host can edit this.";$("submit").disabled=true}
  }else useTemplate("thanksgiving");
}
init();
}
</script>
</body>
</html>
