<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potluck · 150ct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/app.css">
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<script src="/apps/potluck/lib.js"></script>
<style>
.dl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.d{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px}
.d>svg{width:32px;height:32px}
.d .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.d .by{font-size:14px;color:var(--mute)}
.d.taken{background:var(--done)}
.d.mine{border-color:var(--hero);box-shadow:inset 0 0 0 2px var(--acc)}
.d .act{display:flex;gap:6px;align-items:center}
.take{min-height:44px;padding:0 14px;border:2px solid var(--hero);background:var(--hero);color:#fff;font:700 13px Silkscreen,monospace;border-radius:8px;white-space:nowrap}
.undo{min-height:40px;padding:0 12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 14px "Work Sans",sans-serif;border-radius:8px}
.count{font-family:Silkscreen,monospace;font-size:14px;color:var(--mute)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1}
.admin{display:grid;gap:12px}
.admin h2{font-size:20px;margin:0}
.admin .people{display:grid;gap:2px}
.admin .people div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed rgba(0,0,0,.2)}
.admin .rm{color:#21160f}
.admin .small{font-size:14px}
.admin .btn{background:#21160f;color:#fff;border-color:#21160f}
.admin .btn.ghost{background:transparent;color:#21160f}
</style>
</head>
<body>
<nav class="top"><div class="wrap"><a href="/">150ct</a></div></nav>
<div id="admin"></div>
<header class="band hero">
  <div class="wrap">
    <div>
      <h1 id="title">Loading…</h1>
      <div class="det" id="det"></div>
    </div>
    <div class="sprite" id="sprite" role="img" aria-label="Invite picture"></div>
  </div>
</header>

<main class="band">
  <div class="wrap" id="main" hidden>
    <div class="head"><h2>Dishes</h2><span class="count" id="count"></span></div>
    <div class="f" id="nameRow" style="display:grid;gap:6px;margin:14px 0 16px">
      <label for="name">Your name</label>
      <input id="name" autocomplete="given-name" maxlength="40" placeholder="So people know who's bringing what">
    </div>
    <ul class="dl" id="list"></ul>
    <div class="addrow"><input id="addIn" maxlength="60" placeholder="Bringing something else?" autocomplete="off" aria-label="Add a dish you're bringing"><button class="btn ghost" id="addBtn" type="button">Add</button></div>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <div class="wrap" id="missing" hidden><p class="hint" id="missingText"></p><p><a href="/potluck">Make a potluck</a></p></div>
</main>
<footer class="band foot"><div class="wrap"><a class="pack" href="/"><span>150</span><span>ct</span></a><span>Free, no accounts, deletes itself 30 days after the event.</span><a href="/potluck">Make your own</a></div></footer>

<script>
{
const {copyText,esc,dishIcon,applyLook,sprite,fmtWhen,mapsUrl,normalize}=window.G;
const $=id=>document.getElementById(id);
const slug=location.pathname.split("/").filter(Boolean).pop();
const guestUrl=location.origin+"/potluck/"+slug;

// Host key: from #host=… (then remembered in this browser), or from storage.
let hostKey="";
try{
  const m=location.hash.match(/host=([a-z0-9]+)/);
  if(m){hostKey=m[1];localStorage.setItem("150ct-host-"+slug,hostKey);history.replaceState(null,"",location.pathname)}
  else hostKey=localStorage.getItem("150ct-host-"+slug)||"";
}catch(e){}

// Guest identity: one per browser.
let myId="",myName="";
try{const s=JSON.parse(localStorage.getItem("150ct-me")||"null");if(s){myId=s.id||"";myName=s.name||""}}catch(e){}
if(!/^[a-z0-9]{20,40}$/.test(myId))myId=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(36).padStart(2,"0")).join("").slice(0,28);
const remember=()=>{try{localStorage.setItem("150ct-me",JSON.stringify({id:myId,name:mine.name}))}catch(e){}};

let ev=null,docs={},isHost=false,live=false,dirty=false,saving=false,pending=false,saveT=null;
let mine={name:myName,take:[],add:[]};
remember();$("name").value=mine.name;

const hdr=()=>hostKey?{"x-host-key":hostKey}:{};
const status=t=>$("status").textContent=t;
const rows=()=>{const all={...docs};all[myId]={...(docs[myId]||{}),name:isHost?"Host":mine.name,take:mine.take,add:mine.add};return all};
const takerOf=k=>{for(const [id,r] of Object.entries(rows()))if((r.take||[]).includes(k))return [id,r];return null};
const label=(id,r)=>id===myId?"You":(r.name||"Someone");

function renderEvent(){
  applyLook(ev.icon);
  document.title=ev.title;
  $("title").textContent=ev.title;
  $("sprite").innerHTML=sprite(ev.icon);
  const out=[];
  const when=fmtWhen(ev.date,ev.time);
  if(when)out.push(`<div><b>When</b><span>${esc(when)}</span></div>`);
  if(ev.where)out.push(`<div><b>Where</b><span><a href="${esc(mapsUrl(ev.where))}">${esc(ev.where)}</a></span></div>`);
  if(ev.note)out.push(`<div><b>Note</b><span style="white-space:pre-line">${esc(ev.note)}</span></div>`);
  $("det").innerHTML=out.join("");
  $("nameRow").hidden=isHost;
  $("main").hidden=false;
}

function render(){
  const all=rows(),keys=new Set(ev.dishes.map(d=>d.k));
  let taken=0;
  const listed=ev.dishes.map(d=>{
    const t=takerOf(d.k);if(t)taken++;
    const isMine=t&&t[0]===myId;
    const act=!t?`<button class="take" data-take="${esc(d.k)}" type="button" ${live?"":"disabled"}>I'll bring it</button>`
      :isMine?`<button class="undo" data-untake="${esc(d.k)}" type="button">Undo</button>`
      :"";
    return `<li class="d${t?" taken":""}${isMine?" mine":""}">${dishIcon(d.n)}<div><div class="nm">${esc(d.n)}</div><div class="by">${t?esc(label(...t)):"Open"}</div></div><div class="act">${act}</div></li>`;
  });
  const extra=[];
  for(const [id,r] of Object.entries(all))(r.add||[]).forEach((n,i)=>{
    if(!String(n).trim())return;
    const act=id===myId?`<button class="undo" data-unadd="${i}" type="button">Remove</button>`:"";
    extra.push(`<li class="d taken${id===myId?" mine":""}">${dishIcon(n)}<div><div class="nm">${esc(n)}</div><div class="by">${esc(label(id,r))}</div></div><div class="act">${act}</div></li>`);
  });
  $("list").innerHTML=listed.join("")+extra.join("")||`<li class="hint">No dishes yet. Add what you're bringing.</li>`;
  $("count").textContent=ev.dishes.length?`${taken} of ${ev.dishes.length} taken`:"";
  if(isHost)renderAdmin();
}

function renderAdmin(){
  const people=Object.entries(docs).filter(([id,r])=>id!==myId&&((r.take||[]).length||(r.add||[]).length));
  const host=guestUrl+"#host="+hostKey;
  $("admin").innerHTML=`<div class="band" style="padding-block:16px"><div class="wrap notice admin">
    <h2>Host</h2>
    <div><b>Send this link to guests</b></div>
    <div class="linkrow"><code>${esc(guestUrl)}</code><button class="btn" data-copy="${esc(guestUrl)}" type="button">Copy</button>${navigator.share?`<button class="btn ghost" id="share" type="button">Share</button>`:""}</div>
    <div class="linkrow"><a href="/potluck?edit=${esc(slug)}">Edit</a> · <button class="btn ghost" id="copyList" type="button">Copy the list</button> · <button class="btn ghost" id="delEv" type="button">Delete</button></div>
    ${people.length?`<div class="people">${people.map(([id,r])=>`<div><span><b>${esc(r.name||"Someone")}</b> · ${esc([...(r.take||[]).map(k=>(ev.dishes.find(d=>d.k===k)||{}).n).filter(Boolean),...(r.add||[])].join(", "))}</span><button class="rm" data-rm="${esc(id)}" type="button">Remove</button></div>`).join("")}</div>`:""}
    <div class="small">This browser remembers you as host. To manage from another device, open your host link there. <button class="btn ghost" data-copy="${esc(host)}" data-label="Copy host link" type="button" style="min-height:32px;font-size:12px;padding:0 10px">Copy host link</button></div>
  </div></div>`;
}

async function load(){
  try{
    const r=await fetch(`/api/links?slug=${encodeURIComponent(slug)}&me=${myId}`,{headers:hdr(),cache:"no-store"});
    const j=await r.json();
    if(!r.ok){$("title").textContent="Not found";$("missingText").textContent=j.error||"This potluck doesn't exist.";$("missing").hidden=false;applyLook("smiley");$("sprite").innerHTML=sprite("smiley");return}
    const first=!ev;
    ev=normalize(j.link.data);docs=j.responses||{};
    if(first){
      isHost=j.isHost;
      if(!isHost&&hostKey){hostKey="";try{localStorage.removeItem("150ct-host-"+slug)}catch(e){}}
      renderEvent();
      const d=docs[myId];
      if(d){mine.take=[...(d.take||[])];mine.add=[...(d.add||[])];if(d.name&&!mine.name&&!isHost){mine.name=d.name;$("name").value=d.name;remember()}}
    }else if(!dirty&&!saving&&docs[myId]){mine.take=[...(docs[myId].take||[])];mine.add=[...(docs[myId].add||[])]}
    else if(!dirty&&!saving){mine.take=[];mine.add=[]}
    live=true;render();
  }catch(e){if(!ev)$("title").textContent="Couldn't load this"}
}

async function save(){
  if(saving){pending=true;return}
  saving=true;dirty=false;status("Saving…");
  try{
    const r=await fetch(`/api/responses?slug=${encodeURIComponent(slug)}`,{method:"POST",headers:{"content-type":"application/json",...hdr()},body:JSON.stringify({id:myId,name:mine.name.trim(),take:mine.take,add:mine.add})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409)status(j.error);else if(!r.ok)throw new Error(j.error);else status("Saved.");
    if(j.responses){docs=j.responses;if(!dirty){const d=docs[myId]||{};mine.take=[...(d.take||[])];mine.add=[...(d.add||[])]}render()}
  }catch(e){status(e.message||"Couldn't save that. Try again in a sec.")}
  saving=false;
  if(pending){pending=false;save()}
}
const queue=()=>{dirty=true;clearTimeout(saveT);saveT=setTimeout(save,400)};
const needName=()=>{if(isHost||mine.name.trim())return false;status("Add your name first.");$("name").focus();return true};

$("list").addEventListener("click",async e=>{
  const t=e.target.closest("[data-take]");
  if(t){if(needName())return;if(takerOf(t.dataset.take))return;mine.take=[...mine.take,t.dataset.take];render();queue();return}
  const u=e.target.closest("[data-untake]");
  if(u){mine.take=mine.take.filter(k=>k!==u.dataset.untake);render();queue();return}
  const a=e.target.closest("[data-unadd]");
  if(a){mine.add=mine.add.filter((_,i)=>i!==+a.dataset.unadd);render();queue();return}
});
function addMine(){
  const n=$("addIn").value.trim();if(!n||!live||needName())return;
  mine.add=[...mine.add,n];$("addIn").value="";render();queue();
}
$("addBtn").addEventListener("click",addMine);
$("addIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addMine()}});
$("name").addEventListener("input",e=>{mine.name=e.target.value;remember();render();if(mine.take.length||mine.add.length)queue()});

async function removePerson(id,b){
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again";return}
  try{const r=await fetch(`/api/responses?slug=${encodeURIComponent(slug)}&id=${encodeURIComponent(id)}`,{method:"DELETE",headers:hdr()});if(!r.ok)throw 0;status("Removed.");load()}
  catch(err){status("Couldn't remove that.")}
}
$("admin").addEventListener("click",async e=>{
  const c=e.target.closest("[data-copy]");
  if(c){const ok=await copyText(c.dataset.copy);c.textContent=ok?"Copied":"Couldn't copy";if(!ok){const code=c.parentElement.querySelector("code");if(code)getSelection().selectAllChildren(code)}setTimeout(()=>c.textContent=c.dataset.label||"Copy",1800);return}
  const rm=e.target.closest("[data-rm]");
  if(rm)return removePerson(rm.dataset.rm,rm);
  if(e.target.id==="share"){try{await navigator.share({title:ev.title,url:guestUrl})}catch(err){}return}
  if(e.target.id==="copyList"){
    const all=rows(),lines=[];
    ev.dishes.forEach(d=>{const t=takerOf(d.k);lines.push(`${d.n}: ${t?(t[0]===myId?"Host":t[1].name||"Someone"):"open"}`)});
    Object.entries(all).forEach(([id,r])=>(r.add||[]).forEach(n=>lines.push(`${n}: ${id===myId?"Host":r.name||"Someone"}`)));
    const ok=await copyText(`${ev.title}\n\n${lines.join("\n")}`);e.target.textContent=ok?"Copied":"Couldn't copy";setTimeout(()=>e.target.textContent="Copy the list",1800);
    return;
  }
  if(e.target.id==="delEv"){
    const b=e.target;
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete for everyone";return}
    const r=await fetch(`/api/links?slug=${encodeURIComponent(slug)}`,{method:"DELETE",headers:hdr()});
    if(r.ok){try{localStorage.removeItem("150ct-host-"+slug)}catch(err){}location.href="/potluck"}else b.textContent="Couldn't delete";
  }
});

load();
setInterval(()=>{if(!document.hidden&&ev)load()},8000);
}
</script>
</body>
</html>
