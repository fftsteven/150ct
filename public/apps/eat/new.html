<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to eat · 150ct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="/apps/eat/style.css">
<link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
<script src="/apps/eat/lib.js"></script>
<style>
.form{display:grid;gap:22px}
.f{display:grid;gap:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.pl{list-style:none;margin:4px 0 2px;padding:0;display:grid;gap:8px}
.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px}
.pl b{font-weight:600}
.pl small{display:block;color:var(--mute);font-size:14px}
.pl button{width:40px;height:40px;border:0;background:transparent;color:var(--mute);font:700 16px Silkscreen,monospace;border-radius:6px}
.pl button:hover{background:var(--line);color:var(--ink)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
@media(max-width:600px){.two{grid-template-columns:1fr}.addrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top"><div class="wrap"><a href="/">150ct</a></div></nav>
<header class="band hero">
  <div class="wrap">
    <div>
      <h1 id="pTitle">Where to eat</h1>
      <div class="det" id="pDet"></div>
    </div>
    <div class="sprite" id="pSprite" role="img" aria-label="Fox"></div>
  </div>
</header>

<main class="band">
  <div class="wrap">
    <form class="form" id="form" novalidate>
      <h2 id="heading">Pick a place together</h2>

      <div class="f"><label for="title">Name</label><input id="title" maxlength="80" placeholder="e.g. Friday dinner" required></div>
      <div class="two">
        <div class="f"><label for="date">Date</label><input id="date" type="date" required></div>
        <div class="f"><label for="time">Time</label><input id="time" type="time"></div>
      </div>
      <div class="f"><label for="near">Area (optional)</label><input id="near" maxlength="80" placeholder="Neighborhood or city, for map links"></div>

      <div class="f">
        <label for="placeIn">Places</label>
        <p class="hint">Type a name or paste a Google Maps link. Everyone taps yes on the ones that work, and guests can add a place.</p>
        <ul class="pl" id="places"></ul>
        <div class="addrow">
          <input id="placeIn" maxlength="300" placeholder="Name or Google Maps link" autocomplete="off">
          <input id="noteIn" maxlength="100" placeholder="Note, e.g. book ahead" autocomplete="off" aria-label="Note for this place">
          <button class="btn ghost" type="button" id="placeAdd">Add</button>
        </div>
      </div>

      <div class="linkrow"><button class="btn" id="submit" type="submit">Create</button><span class="status" id="status" aria-live="polite" style="margin:0"></span></div>
    </form>
  </div>
</main>
<footer class="band foot"><div class="wrap"><a class="pack" href="/"><span>150</span><span>ct</span></a><span>Free, no accounts, deletes itself 30 days after the date.</span></div></footer>

<script>
{
const {fox,esc,fmtWhen,today,looksLikeUrl,nameFromLink}=window.E;
const $=id=>document.getElementById(id);
const editSlug=new URLSearchParams(location.search).get("edit")||"";
let hostKey="";
const hm=location.hash.match(/host=([a-z0-9]+)/);
if(hm)hostKey=hm[1];
else if(editSlug){try{hostKey=localStorage.getItem("150ct-host-"+editSlug)||""}catch(e){}}

let places=[],pick=null,pendingUrl="";
$("pSprite").innerHTML=fox();

function renderPlaces(){
  $("places").innerHTML=places.length?places.map((p,i)=>`<li><span><b>${esc(p.n)}</b>${p.note||p.url?`<small>${[p.note?esc(p.note):"",p.url?"Google Maps link":""].filter(Boolean).join(" · ")}</small>`:""}</span><button type="button" data-del="${i}" aria-label="Remove ${esc(p.n)}">×</button></li>`).join(""):`<li class="hint" style="background:none;border:0;padding:0">No places yet. Add two or three.</li>`;
}
function preview(){
  $("pTitle").textContent=$("title").value.trim()||"Where to eat";
  const when=fmtWhen($("date").value,$("time").value),near=$("near").value.trim();
  $("pDet").innerHTML=(when?`<div><b>When</b><span>${esc(when)}</span></div>`:"")+(near?`<div><b>Area</b><span>${esc(near)}</span></div>`:"");
}
// Type a name, or paste a Google Maps link. If the link doesn't give a name, ask for one.
async function addPlace(){
  const v=$("placeIn").value.trim();if(!v)return;
  if(looksLikeUrl(v)){
    $("status").textContent="Looking it up…";
    const n=await nameFromLink(v);
    if(n===null){$("status").textContent="That isn't a Google Maps link. Type the name instead.";return}
    if(!n){pendingUrl=v;$("placeIn").value="";$("placeIn").placeholder="Name for that link";$("status").textContent="Got the link. What's the place called?";$("placeIn").focus();return}
    $("status").textContent="";
    return push(n,v);
  }
  push(v,pendingUrl);
}
function push(n,url){
  places.push({n,note:$("noteIn").value.trim(),...(url?{url}:{})});
  pendingUrl="";$("placeIn").value="";$("noteIn").value="";$("placeIn").placeholder="Name or Google Maps link";$("status").textContent="";renderPlaces();$("placeIn").focus();
}
$("places").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;places.splice(+b.dataset.del,1);renderPlaces()});
$("placeAdd").addEventListener("click",addPlace);
["placeIn","noteIn"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addPlace()}}));
$("form").addEventListener("input",e=>{if(e.target.id!=="placeIn"&&e.target.id!=="noteIn")preview()});

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if($("placeIn").value.trim())await addPlace();
  const payload={title:$("title").value,date:$("date").value,time:$("time").value,near:$("near").value,places,pick};
  if(!payload.title.trim()){$("status").textContent="Give it a name.";$("title").focus();return}
  if(!payload.date){$("status").textContent="Pick a date.";$("date").focus();return}
  $("submit").disabled=true;$("status").textContent=editSlug?"Saving…":"Creating…";
  try{
    const r=await fetch("/api/links"+(editSlug?"?slug="+encodeURIComponent(editSlug):""),{method:editSlug?"PUT":"POST",headers:{"content-type":"application/json",...(hostKey?{"x-host-key":hostKey}:{})},body:JSON.stringify(editSlug?{data:payload}:{type:"eat",data:payload})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Couldn't save.");
    if(editSlug){location.href="/eat/"+editSlug;return}
    try{localStorage.setItem("150ct-host-"+j.slug,j.hostKey)}catch(err){}
    location.href="/eat/"+j.slug+"#host="+j.hostKey;
  }catch(err){$("status").textContent=err.message||"Couldn't save. Try again.";$("submit").disabled=false}
});

async function init(){
  if(editSlug){
    $("heading").innerHTML=`Edit <a href="/eat/${encodeURIComponent(editSlug)}" style="font:600 15px 'Work Sans',sans-serif;margin-left:10px">Back</a>`;$("submit").textContent="Save";
    try{
      const r=await fetch("/api/links?slug="+encodeURIComponent(editSlug),{headers:hostKey?{"x-host-key":hostKey}:{}});
      const j=await r.json();
      if(!r.ok||!j.isHost)throw 0;
      const ev=j.link.data;
      ["title","date","time","near"].forEach(k=>$(k).value=ev[k]||"");
      places=ev.places.map(p=>({...p}));pick=ev.pick||null;
    }catch(e){$("status").textContent="Only the host can edit this.";$("submit").disabled=true}
  }else $("date").value=today();
  renderPlaces();preview();
}
init();
}
</script>
</body>
</html>
